# The image panel.
#
# Sveltia CMS reads this, shows a form for each file below, and commits the
# result straight to the repository. A commit triggers a Netlify build, so a
# replaced photograph is live a minute or two after it is saved — and every
# version stays in the repository's history, so nothing is ever lost.
#
# There is no server behind this. Signing in uses a GitHub access token you
# create once; the panel talks to GitHub directly from the browser.

backend:
  name: github
  repo: abhijk1011/GI-PACK-TECH-WEBSITE
  # The branch is not set on purpose: the repository's default branch is
  # detected, which is the branch Netlify publishes.
  auth_methods:
    - token
  commit_messages:
    update: Update {{collection}} “{{slug}}”
    uploadMedia: Add photograph {{path}}
    deleteMedia: Remove photograph {{path}}

app_title: GI PackTech images
site_url: https://www.gipacktech.com

# Where uploaded photographs are written, and the address the site refers to
# them by.
media_folder: public/img
public_folder: /img

media_libraries:
  default:
    config:
      # A photograph from a phone arrives at 12 megapixels and several
      # megabytes. Committing that to the repository would be permanent, and
      # sending it to a visitor would be wasteful, so every upload is resized
      # and re-encoded in the browser before it is saved. Nothing on the site
      # is displayed wider than about 900 points, so 1800 covers a retina
      # screen with room to spare.
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1800
        svg:
          optimize: true
      # Generous, because the file is shrunk straight after this check. It is
      # here to catch a video or a RAW file picked by mistake.
      max_file_size: 26214400
      # Phone and WhatsApp filenames carry spaces, brackets and capitals, none
      # of which belong in a URL.
      slugify_filename: true

collections:
  - name: products
    label: Product photographs
    label_singular: Product
    icon: photo_camera
    description: >-
      Pick a product, then drop a photograph onto its slot. The first
      photograph is the one used on cards, in search results and when the page
      is shared, so put the clearest one first.
    folder: content/products
    extension: yml
    format: yaml
    # The products come from the catalogue. Adding or removing one is a
    # code change, so it cannot be done from here.
    create: false
    delete: false
    identifier_field: name
    summary: '{{name}}'
    thumbnail: images.0.image
    sortable_fields:
      - name
      - category
    view_groups:
      - label: Category
        field: category
    fields:
      - name: name
        label: Product
        widget: string
        readonly: true
      - name: category
        label: Category
        widget: string
        readonly: true
      # Carried through untouched: the build matches a file to a product by it.
      - name: slug
        widget: hidden
      - name: brief
        label: What this photograph should show
        widget: text
        required: false
        hint: >-
          Written for the photographer. Hand it over as it is, or use it as the
          prompt for a generated image.
      - name: images
        label: Photographs
        label_singular: photograph
        widget: list
        required: false
        summary: '{{fields.alt}}'
        thumbnail: image
        fields:
          - name: image
            label: Photograph
            widget: image
            # Not required, so a slot can be reserved with its caption written
            # before the photograph exists. The build skips any slot with no
            # file in it, so an empty one is invisible on the site.
            required: false
            hint: >-
              About 1600px wide is plenty. JPEG for photographs, PNG when the
              background needs to be transparent.
          - name: alt
            label: What is in the picture
            widget: string
            hint: >-
              Describe it in a sentence, as if to somebody who cannot see it.
              This is what search engines read, and what a screen reader says.
          - name: caption
            label: Caption
            widget: string
            required: false
            hint: Shown under the photograph on the product page. Optional.

  - name: site
    label: Site-wide images
    icon: imagesmode
    files:
      - name: images
        label: Logo, hero and share picture
        file: content/site-images.yml
        icon: imagesmode
        fields:
          - name: hero
            label: Home page picture
            widget: object
            hint: The picture beside the headline on the home page.
            fields:
              - name: image
                label: Picture
                widget: image
                hint: >-
                  About 1536x1024 or wider. A PNG with a transparent background
                  sits best, because it is shown unframed.
              - name: alt
                label: What is in the picture
                widget: string
          - name: logo
            label: Logo mark
            widget: image
            hint: Shown in the header and the footer. SVG or PNG, square-ish.
          - name: social
            label: Default share picture
            widget: image
            hint: >-
              Used when a page has no picture of its own — for instance when
              the FAQ is shared on WhatsApp or LinkedIn.

  # The blog. Each guide is one Markdown file in content/blog, and the file
  # name is its address: content/blog/what-is-vci-packaging.md is published at
  # /blog/what-is-vci-packaging. Saving commits the file and Netlify rebuilds,
  # so a new guide is live, in the sitemap, the feed and /llms.txt, a minute or
  # two later. The build checks every product, industry and guide a post names,
  # and stops rather than publish a link to a page that does not exist.
  - name: blog
    label: Blog guides
    label_singular: Guide
    icon: article
    description: >-
      Technical guides for buyers. Start with the short answer: two or three
      sentences that answer the question in the title on their own. That is
      the passage search engines and AI assistants quote.
    folder: content/blog
    extension: md
    format: frontmatter
    create: true
    delete: true
    identifier_field: title
    slug: '{{slug}}'
    slug_length: 70
    summary: '{{title}}'
    sortable_fields:
      - title
      - published
      - topic
    view_groups:
      - label: Topic
        field: topic
    fields:
      - name: title
        label: Title
        widget: string
        hint: >-
          The question or subject in the words a buyer would search with, for
          example "What Is VCI Packaging? Corrosion Protection Without Oil".
      - name: seo_title
        label: Title in search results
        widget: string
        required: false
        hint: Optional. Under 65 characters, ending "| GI PackTech". Leave empty to use the title.
      - name: description
        label: One-line description
        widget: text
        hint: >-
          Shown under the title and in search results. 158 characters at most —
          longer is cut off mid-sentence.
      - name: topic
        label: Topic
        widget: select
        options:
          - { label: 'Sourcing and export', value: sourcing-and-export }
          - { label: 'Industry guides', value: industry-guides }
          - { label: 'Drum and vessel liners', value: drum-and-vessel-liners }
          - { label: 'FIBC, liners and sacks', value: bulk-bags-and-liners }
          - { label: 'Static safety', value: static-safety }
          - { label: 'Barrier and moisture', value: barrier-and-moisture }
          - { label: 'Shipping and logistics', value: shipping-and-logistics }
          - { label: 'Machinery and export packing', value: machinery-and-export-packing }
          - { label: 'Innovation and sustainability', value: innovation-and-sustainability }
      - name: published
        label: Published
        widget: datetime
        type: date
        format: YYYY-MM-DD
        default: '{{now}}'
      - name: updated
        label: Last changed
        widget: datetime
        type: date
        format: YYYY-MM-DD
        default: '{{now}}'
        hint: Move this forward whenever the words change. Search engines read it.
      - name: draft
        label: Draft — keep off the site
        widget: boolean
        default: false
        required: false
      - name: summary
        label: Short answer
        widget: text
        hint: >-
          40 to 70 words that answer the title's question completely, with no
          "in this article". It is shown first on the page and quoted by AI
          assistants.
      - name: takeaways
        label: Key takeaways
        widget: list
        required: false
        hint: Four or five one-line facts a reader leaves with.
      - name: audience
        label: Written for
        widget: list
        required: false
        hint: For example "Chemical plants", "Machinery manufacturers".
      - name: keywords
        label: Search phrases
        widget: list
        required: false
        hint: The phrases a buyer would type. Used in the page's metadata.
      - name: body
        label: Guide
        widget: markdown
        hint: >-
          Use headings for each question the guide answers. Tables work. Link
          to products with their address, for example /products/round-drum-liners.
      - name: faqs
        label: Questions and answers
        label_singular: question
        widget: list
        required: false
        summary: '{{fields.question}}'
        fields:
          - { name: question, label: Question, widget: string }
          - { name: answer, label: Answer, widget: text, hint: 'Under 70 words, complete on its own.' }
      - name: products
        label: Products this guide is about
        widget: relation
        collection: products
        value_field: slug
        search_fields: [name]
        display_fields: [name]
        multiple: true
        required: false
        hint: Most central first. Each product page links back to the guide.
      - name: industries
        label: Industries
        widget: select
        multiple: true
        required: false
        options:
          - { label: 'Machine Tools and Heavy Engineering', value: machine-tools-and-heavy-engineering }
          - { label: 'Power and Electrical Equipment', value: power-and-electrical-equipment }
          - { label: 'Lubricants and Base Oils', value: lubricants-and-base-oils }
          - { label: 'Chemicals and Specialty Chemicals', value: chemicals-and-specialty-chemicals }
          - { label: 'Pharmaceutical and Intermediates', value: pharmaceutical-and-intermediates }
          - { label: 'Food and Food Ingredients', value: food-and-food-ingredients }
          - { label: 'Fertilisers and Agrochemicals', value: fertilisers-and-agrochemicals }
          - { label: 'Warehousing, Exports and Logistics', value: warehousing-exports-and-logistics }
          - { label: 'Oil, Petrochemical and Refinery', value: oil-petrochemical-and-refinery }
          - { label: 'Alcohol and Breweries', value: alcohol-and-breweries }
          - { label: 'Automotive and Component Manufacturing', value: automotive-and-component-manufacturing }
          - { label: 'Metals, Alloys and Scrap', value: metals-alloys-and-scrap }
          - { label: 'Construction and Infrastructure', value: construction-and-infrastructure }
          - { label: 'Demolition and Remediation', value: demolition-and-remediation }
      - name: related
        label: Related guides
        widget: relation
        collection: blog
        value_field: '{{slug}}'
        search_fields: [title]
        display_fields: [title]
        multiple: true
        required: false
      - name: image
        label: Share picture
        widget: image
        required: false
        hint: Optional. Used when the guide is shared. Defaults to the first product's photograph.
      - name: priority
        label: Order within a day
        widget: number
        value_type: int
        required: false
        hint: Lower comes first on the blog page when guides share a publish date.
