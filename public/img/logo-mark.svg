<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 72" role="img" aria-label="GI PackTech">
  <title>GI PackTech</title>
  <!-- Orange square with the G -->
  <rect x="0" y="0" width="72" height="72" fill="#F4520E"/>
  <g>
    <circle cx="36" cy="36" r="20" fill="none" stroke="#FFFFFF" stroke-width="12"/>
    <!-- cut the opening in the upper right of the ring -->
    <rect x="36" y="23" width="30" height="9" fill="#F4520E"/>
    <!-- the G crossbar -->
    <rect x="38" y="32" width="21" height="11" fill="#FFFFFF"/>
  </g>
  <!-- the i: purple dot over a green stem -->
  <rect x="80" y="0" width="20" height="15" fill="#4A1DC4"/>
  <rect x="80" y="22" width="20" height="50" fill="#156A20"/>
</svg>
