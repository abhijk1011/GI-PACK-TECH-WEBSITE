name: Heavy Duty Bulk Bags — 25 kg and 50 kg
category: Container Liners and Heavy Duty Sacks
slug: heavy-duty-bulk-bags-25kg-and-50kg
brief: |-
  Three photographs. Real industrial photography, natural light, no 3D-render look. Printing on the
  sacks should read as clean abstract colour bands and blocks with no legible lettering and no
  brand names. 4:3 landscape, about 1600px wide.

  1. A FILLED PALLET OF 25 KG SACKS
  A full pallet of filled 25 kilogram heavy duty sacks stacked square and interlocked, five layers
  high, in a clean warehouse. The sacks are block bottom and stand flat-topped rather than pillowed,
  in a matte white and deep orange colour scheme with plain printed bands. Slight sheen on the
  polyethylene where the light catches it. Shot from a low three-quarter angle so the block bottom
  shape and the square stack are both obvious, with the warehouse racking soft behind. Even, cool
  daylight. No people, no legible text, no logos.

  2. THE VALVE, DURING FILLING
  Tight close-up of the corner valve of a heavy duty sack on an automatic filling head, mid-fill.
  The fabric valve sleeve is stretched over the steel filling spout and the sack below is visibly
  inflating with powder. Fine dust in the air, a little product settled on the machine bed. Shallow
  depth of field, focus on the join between the spout and the valve sleeve. Hard industrial lighting
  from one side. A gloved operator hand may enter the frame at the edge, no face. No legible text.

  3. THE TWO CONSTRUCTIONS, SIDE BY SIDE
  Studio-lit comparison on a plain mid-grey seamless background. Two filled 25 kilogram sacks stand
  side by side, three-quarter view, lit from the upper left with a soft key and a hard rim light.
  On the left, a co-extruded polyethylene sack: smooth, slightly glossy, with a clean welded seal
  across the top and no stitching anywhere. On the right, a woven polypropylene sack: visible woven
  tape texture, laminated matte finish, stitched and taped top. The difference in surface and in
  closure must be legible at a glance. No people, no legible text, no logos.
