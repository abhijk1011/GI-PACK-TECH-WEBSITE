name: Multilayer Plastic Liner for Non-Hazardous Products
category: Bulk Bag and FIBC Liners
slug: multilayer-plastic-liner
brief: >-
  A multilayer PE liner being fitted inside an FIBC, and a second shot of the same liner filled and
  holding a square shape.
images:
