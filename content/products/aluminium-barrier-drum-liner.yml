name: Aluminium Barrier Drum Liner
category: Round Drum Liners
slug: aluminium-barrier-drum-liner
brief: >-
  A silver aluminium laminate drum liner, partly open to show the layer structure at the cut edge,
  next to a sealed filled liner. Studio lighting on a light grey background.
images:
  - image: /img/aluminium-barrier-drum-liner-1.webp
    alt: Aluminium barrier drum liner, filled and standing on a pallet
    caption: An aluminium layer stops what polyethylene alone lets through.
  - image: /img/aluminium-barrier-drum-liner-2.webp
    alt: Cut end of an aluminium barrier liner showing the foil layer within the laminate
    caption: The foil is the barrier. The layers either side protect it.
  - image: /img/aluminium-barrier-drum-liner-3.webp
    alt: >-
      Open drum with an aluminium barrier liner and a desiccant sachet, in a warehouse of stored
      drums
    caption: Specified where the product has to sit through a long sea route.
