name: Container Liner for Dry Bulk — PP Woven and PE Film
category: Container Liners and Heavy Duty Sacks
slug: container-liner-pp-woven-and-pe-film
brief: >-
  Three photographs. Real industrial photography, natural light, no 3D-render look, no visible

  brand names or legible lettering anywhere. 4:3 landscape, about 1600px wide.


  1. FITTED AND EMPTY, INSIDE THE CONTAINER

  Interior of a clean 20-foot steel shipping container photographed from the open door end, with a

  white woven polypropylene container liner already fitted and hanging loose against all four walls

  and the roof. The fabric follows the corrugations of the container but hangs slightly away from

  them. Straps run up to the container lashing rings along the top rail. Daylight comes in from the

  open doors behind the camera and falls off towards the far end. Wide shot, camera at chest height,

  centred on the container axis, so the liner reads as one continuous sealed bag rather than a
  sheet.

  Concrete loading yard just visible at the edge of frame. No people, no text, no logos.


  2. LOADING THROUGH THE TOP FILLING SPOUT

  Close three-quarter view of a pale free-flowing granular product pouring through a fabric filling

  spout into the top of a fitted container liner. The spout is a tube of the same woven fabric,

  tied off around a steel loading chute. Fine dust is caught in the light. The liner below is

  visibly filling and pushing outward against the container wall. Shot from a raised position just

  outside the container door, shallow depth of field on the spout, container interior falling into

  shadow behind. Industrial, slightly gritty, real. No people in frame, no text, no logos.


  3. THE BULKHEAD AT THE DOOR END

  The door end of a loaded container photographed square on with both doors open. A heavy woven

  bulkhead panel spans the full opening, holding back the bulk cargo behind it, with horizontal

  steel bars slotted through sewn fabric pockets across its width. A closed discharge spout is

  visible low in one corner of the bulkhead. The fabric is under visible tension and bulges slightly

  between the bars. Overcast daylight, port or factory yard background thrown out of focus. The shot

  should make it obvious that this panel is the only thing between the cargo and the ground.

  No people, no text, no logos.
