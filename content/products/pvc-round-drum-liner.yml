    caption: PVC where the product needs a liner that stays flexible and clear.
  - image: /img/pvc-round-drum-liner-2.webp
    alt: Clear PVC liner clamped over the rim of a drum, seal detail
    caption: Clamped at the rim so nothing works its way behind the liner.
