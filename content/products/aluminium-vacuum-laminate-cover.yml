name: Aluminium Vacuum Laminate Cover
category: Machine Covers and Protective Packaging
slug: aluminium-vacuum-laminate-cover
brief: >-
  A precision machine sealed inside a silver aluminium vacuum laminate cover, film drawn tight to
  the machine profile, with the seal line and a humidity indicator visible.
images:
  - image: /img/aluminium-vacuum-laminate-cover1.webp
    alt: Machine vacuum packed in aluminium laminate with an inspection window over the control head
    caption: Vacuum packed, so the air that carries moisture is taken out first.
  - image: /img/aluminium-vacuum-laminate-cover2.webp
    alt: Humidity indicator set into the seam of a vacuum-sealed aluminium laminate cover
    caption: The indicator shows on arrival whether the seal held.
  - image: /img/aluminium-vacuum-laminate-cover3.webp
    alt: Technicians drawing vacuum on an aluminium laminate cover around a motor on its timber bearers
    caption: Sealed at the works, opened at the destination.
