name: Pallet Top Sheet and Pallet Liner
category: Pallet Covers and Pallet Wraps
slug: pallet-top-sheet-and-liner
brief: >-
  A pallet top sheet being laid over a stacked load before stretch wrapping, and a pallet liner
  placed on the deck boards under the load.
images:
  - image: /img/pallet-top-sheet-and-pallet-liner1.webp
    alt: Clear top sheet laid over a pallet of cartons
    caption: The cheapest part of the pallet, protecting the most exposed face.
  - image: /img/pallet-top-sheet-and-pallet-liner2.webp
    alt: Water beading on a pallet top sheet with the cartons underneath dry
    caption: Dust and drips stop at the sheet.
  - image: /img/pallet-top-sheet-and-pallet-liner3.webp
    alt: Top sheet placed over a pallet at a stretch wrapper
    caption: Applied in the same pass as the wrap.
