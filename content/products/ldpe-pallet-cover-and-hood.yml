name: LDPE Pallet Cover and Pallet Hood
category: Pallet Covers and Pallet Wraps
slug: ldpe-pallet-cover-and-hood
brief: >-
  A loaded pallet with a clear LDPE pallet hood pulled down over the full stack and tucked under the
  pallet edge, in a warehouse.
images:
  - image: /img/ldpe-pallet-cover-and-pallet-hood1.webp
    alt: Pallet of cartons under a clear LDPE hood
    caption: One hood over the load, rather than a wrap that has to be reapplied.
  - image: /img/ldpe-pallet-cover-and-pallet-hood2.webp
    alt: Bottom edge of an LDPE hood drawn down over the pallet timbers
    caption: Drawn below the top deck, so water runs off rather than in.
  - image: /img/ldpe-pallet-cover-and-pallet-hood3.webp
    alt: Warehouse operator pulling an LDPE hood down over a loaded pallet
    caption: Fitted by one person in seconds.
