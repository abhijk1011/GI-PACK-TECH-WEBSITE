[build]
  # Every page is rendered to a file at deploy time, from the content in
  # src/content. Reading the site therefore touches nothing but the CDN: no
  # function to cold start, no database to wake, no connection string to get
  # right, no runtime to keep pinned.
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pinned so a change to Netlify's default cannot break a deploy.
  NODE_VERSION = "20"
  # NODE_ENV is deliberately not set here. Setting it to "production" makes
  # npm skip devDependencies during the build.

# The redirects the Express app used to answer — the retired /capabilities
# page, the old FAQ addresses, and product URLs reached under the wrong
# category — are generated into dist/_redirects by the build, because they are
# derived from the catalogue rather than written by hand.

# The stylesheets and scripts keep the same filenames from one deploy to the
# next, so they must not be cached by their name alone: a browser holding a
# week-old site.css would pair it with freshly rendered markup. The pages
# request them with a ?v= that changes per deploy (see src/lib/assets.js), and
# these headers let the CDN cache them while browsers revalidate — a 304 on
# every hit, and the new file the moment the version changes.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# The font files are a fixed release of Inter, so the bytes behind these names
# never change. Cache them for a year.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
