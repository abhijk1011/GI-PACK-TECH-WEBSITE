[build]
  # `public` holds the CSS, JavaScript, webfonts, logo and the catalogue
  # photographs. Netlify serves those straight from its CDN; everything else
  # falls through to the function below.
  publish = "public"
  functions = "netlify/functions"

  # Creates the schema and loads the catalogue. Safe to run on every deploy:
  # inserts use ON CONFLICT DO NOTHING, so content edited in the admin panel
  # is left alone.
  command = "npm run seed"

[build.environment]
  # Pinned so a change to Netlify's default cannot break a deploy.
  NODE_VERSION = "20"
  # NODE_ENV is deliberately not set here. Setting it to "production" makes
  # npm skip devDependencies during the build.

[functions]
  # The EJS templates are read at runtime, so they must travel with the bundle.
  node_bundler = "esbuild"
  included_files = ["views/**", "src/**"]

  # EJS is copied in whole rather than bundled. It resolves templates and
  # partials at runtime, which a bundler cannot follow.
  external_node_modules = ["ejs"]

  # PGlite is deliberately absent from that list. It is a devDependency, so it
  # may not be installed here, and asking the bundler to include a missing
  # package fails the build. src/db.js builds its module id at runtime instead,
  # which keeps it out of the bundle either way.

[functions."server"]
  # Plenty for a page render; the default is lower on some plans.
  timeout = 26

# Static files in `public` win automatically, so this only catches page
# requests, form posts, the admin panel and uploaded images.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200

# The stylesheets and scripts keep the same filenames from one deploy to the
# next, so they must not be cached by their name alone: a browser holding a
# week-old site.css would pair it with freshly rendered markup. The pages
# request them with a ?v= that changes per deploy (see src/lib/assets.js), and
# these headers let the CDN cache them while browsers revalidate — a 304 on
# every hit, and the new file the moment the version changes.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# The font files are a fixed release of Inter, so the bytes behind these names
# never change. Cache them for a year.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
